name: Feature request
description: Propose a bounded user-visible improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Repeated user problem
      description: What future repetition, correction, or unsafe action would this reduce?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Owner and skip boundary
      description: Which existing owner should contain the change, and when should it not apply?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and acceptance
      description: What concrete result would prove the smallest useful slice?
    validations:
      required: true
