name: Core and Scout contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contracts:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Sidecar
        run: python -m pip install -e .
      - name: Install native Skill discovery runtime for platform regression
        if: matrix.python-version == '3.13'
        run: npm install --global @openai/codex@0.166.0
      - name: Verify active Core and Scout contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest discover &&
          python scripts/check_doc_links.py

  public-release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install release test dependencies
        run: python -m pip install -e . build==1.5.0
      - name: Export, commit, build, and consume a synthetic public release
        env:
          AGENT_MEMORY_PUBLIC_RELEASE_SMOKE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest -v
          tests.test_public_distribution.PublicDistributionTests.test_positive_public_release_lane

  package:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build Core wheel and sdist
        run: |
          python -m pip install build==1.5.0
          python -m build --sdist --wheel
      - name: Smoke installed wheel
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install --no-deps dist/*.whl
          .venv-smoke/bin/python -m agent_memory_sidecar --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-packages
          path: dist/*
          if-no-files-found: error

  artifact-smoke:
    if: github.event_name != 'push'
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-packages
          path: dist
      - name: Install built wheel and run CLI
        run: >-
          python -c "import glob,subprocess,sys; wheels=glob.glob('dist/*.whl'); assert len(wheels)==1;
          subprocess.check_call([sys.executable,'-m','pip','install','--no-deps',wheels[0]])" &&
          python -m agent_memory_sidecar --help

  core-gate:
    if: always()
    needs: [contracts, public-release-smoke, package, artifact-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required CI gates for event type
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          RELEASE_SMOKE_RESULT: ${{ needs.public-release-smoke.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          ARTIFACT_SMOKE_RESULT: ${{ needs.artifact-smoke.result }}
        run: |
          python -c "
          import os, sys
          event = os.environ['EVENT_NAME']
          results = {
              'contracts': os.environ['CONTRACTS_RESULT'],
              'public-release-smoke': os.environ['RELEASE_SMOKE_RESULT'],
              'package': os.environ['PACKAGE_RESULT'],
              'artifact-smoke': os.environ['ARTIFACT_SMOKE_RESULT'],
          }
          print(f'core-gate ({event}) upstream results:', results)
          required = ['public-release-smoke'] if event == 'push' else list(results)
          bad = {k: results[k] for k in required if results[k] != 'success'}
          if event == 'push':
              for k in ('contracts', 'package', 'artifact-smoke'):
                  if results[k] not in ('skipped', 'success'):
                      bad[k] = results[k]
          if bad:
              print('core-gate failed due to non-success upstream jobs:', bad, file=sys.stderr)
              sys.exit(1)
          "
