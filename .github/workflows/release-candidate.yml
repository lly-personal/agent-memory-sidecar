name: Release candidate full matrix

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or commit SHA on protected main to qualify"
        required: false
        default: "main"
        type: string
      include_performance:
        description: "Also run hosted-runner performance observation (non-qualifying)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Sidecar
        run: python -m pip install -e .
      - name: Install native Skill discovery runtime for platform regression
        if: matrix.python-version == '3.13'
        run: npm install --global @openai/codex@0.166.0
      - name: Verify full 3x3 Core and Scout contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest discover &&
          python scripts/check_doc_links.py

  public-release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install release test dependencies
        run: python -m pip install -e . build==1.5.0
      - name: Verify synthetic public release lane
        env:
          AGENT_MEMORY_PUBLIC_RELEASE_SMOKE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest -v
          tests.test_public_distribution.PublicDistributionTests.test_positive_public_release_lane

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build Core wheel and sdist
        run: |
          python -m pip install build==1.5.0
          python -m build --sdist --wheel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-core-packages
          path: dist/*
          if-no-files-found: error

  artifact-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rc-core-packages
          path: dist
      - name: Install built wheel and run CLI
        run: >-
          python -c "import glob,subprocess,sys; wheels=glob.glob('dist/*.whl'); assert len(wheels)==1;
          subprocess.check_call([sys.executable,'-m','pip','install','--no-deps',wheels[0]])" &&
          python -m agent_memory_sidecar --help

  performance-observation:
    if: ${{ inputs.include_performance }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Sidecar
        run: python -m pip install -e .
      - name: Record hosted-runner performance observation
        env:
          AGENT_MEMORY_PERFORMANCE_MODE: "observe"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest -v tests.test_performance

  release-candidate-gate:
    if: always()
    needs: [contracts, public-release-smoke, package, artifact-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce full release-candidate matrix succeeded
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          RELEASE_SMOKE_RESULT: ${{ needs.public-release-smoke.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          ARTIFACT_SMOKE_RESULT: ${{ needs.artifact-smoke.result }}
        run: |
          python -c "
          import os, sys
          results = {
              'contracts': os.environ['CONTRACTS_RESULT'],
              'public-release-smoke': os.environ['RELEASE_SMOKE_RESULT'],
              'package': os.environ['PACKAGE_RESULT'],
              'artifact-smoke': os.environ['ARTIFACT_SMOKE_RESULT'],
          }
          bad = {k: v for k, v in results.items() if v != 'success'}
          if bad:
              print('release-candidate-gate failed:', bad, file=sys.stderr)
              sys.exit(1)
          print('release-candidate-gate passed:', results)
          "
