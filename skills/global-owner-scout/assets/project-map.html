<script type="application/json" id="atlas-data">__SCOUT_DATA__</script>
<script>
(()=>{
const root=document.getElementById('__SCOUT_ROOT__');
const source=JSON.parse(root.querySelector('#atlas-data').textContent);
// Presentation projection only: every fact and identity comes from the frozen map.
const map=source.project_map, ids=new Set(map.nodes.map(n=>n.id));
let overview='overview';while(ids.has(overview))overview+='-';
const evidence=Object.fromEntries(source.evidence_sources.flatMap(s=>s.refs.map(r=>[r.ref,{type:r.type,section:r.ref,text:r.summary,path:r.ref}])));
const statements=(n,layers)=>n.claims.filter(c=>layers.includes(c.layer)).map(c=>`${source.layer_labels[c.layer]}：${c.statement}`).join(' ');
const nodes=map.nodes.map(n=>{const parents=map.edges.filter(e=>e.kind==='contains'&&e.target===n.id).map(e=>e.source);return {
 id:n.id,parents:parents.length?parents:[overview],title:n.label,role:/^[a-z_]+$/i.test(n.kind)?'工程职责':n.kind,summary:n.summary,
 why:statements(n,['design','inference'])||n.summary,keep:`维护归属：${n.owner}。${statements(n,['implementation','observed'])}`,
 unknown:statements(n,['unknown'])||'已知事实限于所列来源；不能据此宣称其他环境或后续采用。',refs:[...new Set([...n.evidence_refs,...n.claims.flatMap(c=>c.evidence_refs)])]};});
nodes.unshift({id:overview,parents:[],title:map.title,role:'工程目标与边界',summary:map.goal,why:map.boundary,
 keep:'本轮没有新增建议不代表缺少工程全貌。',unknown:map.coverage.map(c=>c.explanation).join(' '),refs:[...new Set(map.nodes.flatMap(n=>n.evidence_refs))]});
const scopeFor=id=>[...new Set([...map.nodes.filter(n=>n.card_ids.includes(id)).map(n=>n.id),...map.edges.filter(e=>e.card_ids.includes(id)).flatMap(e=>[e.source,e.target]),...map.journeys.filter(j=>j.card_ids.includes(id)).flatMap(j=>[j.entry,...j.edge_ids.map(id=>map.edges.find(e=>e.id===id).target)])])];
const data={name:map.title,root:overview,revision:map.source_revision,observed_at:map.observed_at,sources:evidence,nodes,
 relations:map.edges.map(e=>({id:e.id,from:e.source,to:e.target,type:e.kind||'handoff',kind:source.relation_labels[e.kind]||'执行交接',detail:e.label+'。'+e.claims.map(c=>`${source.layer_labels[c.layer]} · ${c.environment}：${c.statement}`).join(' '),refs:[...new Set([...e.evidence_refs,...e.claims.flatMap(c=>c.evidence_refs)])]})),
 journeys:map.journeys.map(j=>({id:j.id,title:j.label,result:j.outcome,exception:j.recovery,steps:[[j.entry,'场景入口',map.nodes.find(n=>n.id===j.entry).claims],...j.edge_ids.map(id=>{const e=map.edges.find(e=>e.id===id);return [e.target,e.label,e.claims];})]})),
 evolution:map.edges.filter(e=>e.kind==='evolves').map(e=>({date:'演进依据',title:e.label,before:map.nodes.find(n=>n.id===e.source).summary,
  choice:map.nodes.find(n=>n.id===e.target).summary,tradeoff:e.claims.map(c=>`${source.layer_labels[c.layer]} · ${c.environment}：${c.statement}`).join(' '),nodes:[e.source,e.target],refs:[...new Set([...e.evidence_refs,...e.claims.flatMap(c=>c.evidence_refs)])]})),
 matrix:[...map.nodes.map(n=>({...n,selection:'node',scope:[n.id]})),...map.edges.map(e=>({...e,selection:'edge',scope:[e.source,e.target]}))].flatMap(n=>n.claims.map(c=>[`${n.label} · ${c.environment} · ${source.layer_labels[c.layer]}`,c.statement,c.layer==='unknown'?'本项未证。':'仅支持本项声明，安装、启用、执行与采用分别核对。',n.id,n.selection,n.scope])),
 advice:source.advice.filter(a=>a.recommended_action!=='ignore').map(a=>({id:a.card_id,parent:a.parent_card_id||null,title:a.title,level:a.parent_card_id?'下层方案':'整体建议',
  scope:scopeFor(a.card_id).length?scopeFor(a.card_id):[overview],basis:a.human_context.project_story,recommend:a.recommendation,userCost:a.human_context.user_cost,before:a.human_context.concrete_before,after:a.human_context.concrete_after,disposition:a.recommended_action_reason,
  options:a.alternatives?.map(o=>[o.approach,o.tradeoff])||[['当前处理',a.recommended_action_reason]],
  benefit:a.benefit_hypothesis||a.human_context.concrete_after,cost:a.implementation_cost||a.human_context.user_cost,
  counter:[...new Set([a.human_context.strongest_counterpoint,...(a.anti_examples||[])])].join(' '),owner:a.owner_rationale,verify:[...(a.validation_conditions||[]),...a.unproven].join(' '),refs:a.direct_evidence?.map(e=>e.ref)||a.human_context.evidence_refs}))};
const qs=s=>root.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={node:data.root,view:'structure',advice:null,journey:null,edge:null,expanded:[],relation:'handoff'}, history=[];
const views=[['structure','整体分工'],['path','按任务理解'],['graph','协作关系图'],['relations','关系详情'],['evolution','演进取舍'],['evidence','事实与依据'],['advice','改进建议']];
const project=()=>data, node=id=>project().nodes.find(x=>x.id===id), advice=id=>project().advice.find(x=>x.id===id);
const button=(id,label,cls='at-link',extra='')=>`<button type="button" class="btn btn-ghost ${cls}" data-node="${esc(id)}" ${extra}>${esc(label)}</button>`;
const children=id=>data.nodes.filter(x=>x.parents.includes(id));
function ancestors(id){const found=new Map(),pending=[id];while(pending.length){const n=node(pending.pop());if(!n||found.has(n.id))continue;found.set(n.id,n);pending.push(...n.parents);}return [...found.values()].reverse();}
function breadcrumbs(id){const path=[];let n=node(id);while(n){path.unshift(n);if(!n.parents.length)break;let parent=n.parents.length===1?n.parents[0]:null;if(!parent)for(const visit of [...history].reverse()){const candidates=n.parents.filter(p=>p===visit.node||ancestors(p).some(a=>a.id===visit.node));if(candidates.length===1){parent=candidates[0];break;}}n=node(parent||data.root);}return path;}
function relatedScope(scope,id){return scope.includes(id)||ancestors(id).some(n=>scope.includes(n.id))||scope.some(s=>ancestors(s).some(n=>n.id===id));}
function adviceMatches(item,nodeId){const pending=[item];while(pending.length){const a=pending.pop();if(relatedScope(a.scope,nodeId))return true;pending.push(...data.advice.filter(x=>x.parent===a.id));}return false;}
function refs(ids){return [...new Set(ids)].map(id=>{const s=project().sources[id];return s?`<details class="at-source"><summary class="cursor-interaction">${esc(s.type)} · ${esc(s.section)}</summary><p>${esc(s.text)}</p><code>${esc(s.path)}</code><p class="at-small text-small text-muted">源码 ${esc(project().revision.slice(0,7))} · 本次读取 ${esc(project().observed_at)}</p></details>`:''}).join('');}
function status(msg){qs('.at-status').textContent=msg;}
function selection(){return state.advice?['advice',state.advice]:state.edge?['edge',state.edge]:state.node===data.root?['project',source.project_key]:['node',state.node];}
function snapshot(){const [kind,id]=selection();return {modelContent:{report_hash:source.report_hash,project_key:source.project_key,source_revision:data.revision,context_snapshot_hash:source.context_snapshot_hash,object_kind:kind,object_id:id,advice_id:state.advice,journey_id:state.journey,view:state.view},privateContent:{state:{...state},returnTo:history.at(-1)||null}};}
function persist(){try{if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState(snapshot())).catch(()=>{});}catch{/* Optional persistence never blocks local reading. */}}
function normalizeState(s){if(!s||!node(s.node)||!views.some(v=>v[0]===s.view)||s.advice&&!advice(s.advice))return null;return {node:s.node,view:s.view,advice:s.advice||null,journey:data.journeys.some(j=>j.id===s.journey)?s.journey:null,edge:data.relations.some(r=>r.id===s.edge)?s.edge:null,expanded:Array.isArray(s.expanded)?s.expanded.filter(id=>node(id)):[],relation:Object.hasOwn(source.relation_labels,s.relation)?s.relation:'handoff'};}
function restore(value){const s=value?.privateContent?.state,m=value?.modelContent;if(!s||m?.report_hash!==source.report_hash||m?.project_key!==source.project_key||m?.source_revision!==data.revision||m?.context_snapshot_hash!==source.context_snapshot_hash)return false;const next=normalizeState(s);if(!next)return false;if(JSON.stringify(next)===JSON.stringify(state))return false;state=next;const previous=normalizeState(value.privateContent.returnTo);history=previous?[previous]:[];return true;}
function focusLocation(){const control=state.view==='advice'&&state.advice?qs('.at-advice-path [aria-current="page"]'):qs('.at-lenses [aria-pressed="true"]');control?.focus({preventScroll:true});}
function go(next){const updated={...state,...next};if(JSON.stringify(updated)===JSON.stringify(state))return;history.push({...state});state=updated;render();focusLocation();persist();}
function relationHtml(r){return `<div class="at-relation">${button(r.from,node(r.from).title)}<button type="button" class="btn btn-ghost at-link cursor-interaction" data-edge="${esc(r.id)}">${esc(r.kind)} →</button>${button(r.to,node(r.to).title)}</div><p class="at-small text-small text-muted">${esc(r.detail)}</p>`;}
function applicableJourneys(n){return data.journeys.filter(j=>n.id===data.root||j.steps.some(([id])=>ancestors(id).some(a=>a.id===n.id)));}
function visibleJourney(n){const candidates=applicableJourneys(n);return candidates.find(j=>j.id===state.journey)||candidates[0];}
function renderStructure(n){
 const kids=children(n.id),j=visibleJourney(n);let html='';
 if(n.id===data.root){
  html+=`<div class="at-intent"><span class="at-small text-small text-muted">目标与范围</span><p>${esc(n.why)}</p></div>`;
  if(j)html+=`<section class="at-journey-preview" data-visible-journey="${esc(j.id)}"><h2>${esc(j.title)}</h2><div class="at-route">${j.steps.map(([id],i)=>`${i?'<span aria-hidden="true">→</span>':''}${button(id,node(id).title)}`).join('')}</div><p>${esc(j.result)}</p><button type="button" class="btn btn-ghost at-link" data-view="path">沿这条任务查看交接与恢复 →</button></section>`;
  html+=`<div class="at-sectionhead"><h2>各部分负责什么</h2><button type="button" class="btn btn-ghost at-link" data-view="graph">展开协作关系图 →</button></div><div class="at-branches">`;
  for(const k of kids)html+=`<section class="at-branch"><button type="button" class="btn btn-ghost cursor-interaction" data-node="${esc(k.id)}">${esc(k.title)} ↗</button><p>${esc(k.summary)}</p></section>`;
  html+='</div>';
  const groups=projectRelations(kids,data.relations.filter(r=>r.type!=='contains'));
  html+=`<div class="at-crosslinks"><h3>这些分工如何连接</h3>${groupDetails(groups)||'<p>来源尚未提供可核实的协作关系；这不表示各部分相互独立。</p>'}</div>`;
 }else{
  html+=`<div class="at-intent"><span class="at-small text-small text-muted">为何需要这一部分</span><p>${esc(n.why)}</p></div>`;
  if(kids.length)html+=`<div class="at-sectionhead"><h2>内部职责</h2></div><div class="at-node-list">${kids.map(k=>`<section><div>${button(k.id,k.title)}</div><p>${esc(k.summary)}</p></section>`).join('')}</div>`;
  else html+=`<div class="at-reading"><section><h3>当前实现与维护归属</h3><p>${esc(n.keep)}</p></section><section><h3>已知范围与缺口</h3><p>${esc(n.unknown)}</p></section></div>`;
  const rels=data.relations.filter(r=>r.from===n.id||r.to===n.id);
  if(rels.length)html+=`<details class="at-crosslinks"><summary class="cursor-interaction">与其他职责的交接与约束</summary>${rels.map(relationHtml).join('')}</details>`;
 }
 return html;
}
// Collapse endpoints onto the nearest visible ancestor, retaining every original edge.
function projectRelations(visible,relations){
 const visibleIds=new Set(visible.map(n=>n.id));
 function representative(id){const pending=[id],seen=new Set(),found=new Set();while(pending.length){const next=pending.shift();if(visibleIds.has(next)){found.add(next);continue;}if(seen.has(next))continue;seen.add(next);pending.push(...node(next).parents);}return found.size===1?[...found][0]:id;}
 const groups=new Map();for(const r of relations){const from=representative(r.from),to=representative(r.to),key=JSON.stringify([from,to,r.type]);if(!groups.has(key))groups.set(key,{from,to,type:r.type,kind:r.kind,edges:[]});groups.get(key).edges.push(r);}
 return [...groups.values()];
}
function groupDetails(groups){return groups.map(g=>`<details data-relation-group="${esc(g.type)}"><summary class="cursor-interaction">${esc(node(g.from).title)} ${g.from===g.to?'内部':'→ '+esc(node(g.to).title)} · ${esc(g.kind)}（${g.edges.length}）</summary>${g.edges.map(relationHtml).join('')}</details>`).join('');}
function graphNodes(n){const selected=new Map();function visit(x){if(selected.has(x.id))return;const kids=children(x.id);if(state.expanded.includes(x.id)&&kids.length){for(const k of kids)visit(k);}else selected.set(x.id,x);}for(const k of children(n.id).length?children(n.id):[n])visit(k);return [...selected.values()];}
function graphData(n){const visible=graphNodes(n),scope=new Set([n.id,...data.nodes.filter(x=>ancestors(x.id).some(a=>a.id===n.id)).map(x=>x.id)]),relations=data.relations.filter(r=>r.type!=='contains'&&(scope.has(r.from)||scope.has(r.to)));
 const types=[...new Set(relations.map(r=>r.type))],type=types.includes(state.relation)?state.relation:types[0];
 const groups=projectRelations(visible,relations.filter(r=>r.type===type));
 for(const g of groups)for(const id of [g.from,g.to])if(!visible.some(n=>n.id===id))visible.push(node(id));
 return {visible,groups,types,type};
}
function renderGraph(n){const g=graphData(n);return `<div class="at-sectionhead"><h2>如何协同</h2>${g.types.length?`<select class="form-select" id="atlas-relation" aria-label="选择关系类型">${g.types.map(t=>`<option value="${esc(t)}" ${t===g.type?'selected':''}>${esc(source.relation_labels[t])}</option>`).join('')}</select>`:''}</div><p class="at-small text-small text-muted">先看当前分工，按需展开内部能力；箭头只表示所选关系，具体交接可在下方查看。</p>${state.expanded.length?'<button type="button" class="btn btn-ghost at-link" data-action="collapse">收起展开，回到当前分工</button>':''}<div class="at-network"><svg aria-hidden="true"></svg><div class="at-network-grid">${g.visible.map(x=>`<section class="at-network-node" data-graph-node="${esc(x.id)}">${button(x.id,x.title)}<p class="at-small text-small text-muted">${esc(x.summary)}</p>${children(x.id).length?`<button type="button" class="btn btn-ghost" data-expand="${esc(x.id)}">展开内部能力</button>`:''}</section>`).join('')}</div></div><div class="at-network-summary">${groupDetails(g.groups)||'<p>尚无这部分的协作关系证据。结构分工仍可查看，不补造连线。</p>'}</div>`;}
function drawGraph(){const panel=qs('.at-network');if(!panel)return;const svg=panel.querySelector('svg'),bounds=panel.getBoundingClientRect(),boxes=new Map([...panel.querySelectorAll('[data-graph-node]')].map(el=>[el.dataset.graphNode,el.getBoundingClientRect()])),marker=root.id+'-arrow';
 svg.setAttribute('viewBox',`0 0 ${bounds.width} ${bounds.height}`);let paths='';
 const groups=graphData(node(state.node)).groups.filter(g=>g.from!==g.to),gutter=parseFloat(getComputedStyle(panel.querySelector('.at-network-grid')).paddingTop);
 for(const [index,g] of groups.entries()){const a=boxes.get(g.from),b=boxes.get(g.to);if(!a||!b)continue;
  const x1=(a.left+a.right)/2-bounds.left,y1=a.top-bounds.top,x2=(b.left+b.right)/2-bounds.left,y2=b.top-bounds.top,lane=gutter*(index+1)/(groups.length+1),outer=bounds.width-lane;
  // Route through the reserved gutters, never through an unrelated node's surface.
  const route=Math.abs(y1-y2)<1?`L ${x2} ${y1-lane}`:`L ${outer} ${y1-lane} L ${outer} ${y2-lane} L ${x2} ${y2-lane}`;
  paths+=`<path data-graph-link="${esc(g.type)}" d="M ${x1} ${y1} L ${x1} ${y1-lane} ${route} L ${x2} ${y2}" marker-end="url(#${marker})"><title>${esc(node(g.from).title+' → '+node(g.to).title+'：'+g.kind)}</title></path>`;}
 svg.innerHTML=`<defs><marker id="${marker}" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z"/></marker></defs>`+paths;
}
function renderPath(n){const candidates=applicableJourneys(n);if(!candidates.length)return `<div class="at-callout"><p>已知职责尚未关联到一条完整执行路径。</p><p class="at-small text-small text-muted">保留当前结构与依据，不补造执行顺序。</p></div>`;const j=visibleJourney(n);return `<div class="at-sectionhead"><h2>从场景走到结果</h2><select class="form-select" aria-label="选择执行场景" id="atlas-journey">${candidates.map(x=>`<option value="${esc(x.id)}" ${x.id===j.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><p>${esc(j.result)}</p><ol class="at-steps" data-visible-journey="${esc(j.id)}">${j.steps.map(([id,detail,claims],i)=>`<li><div>${button(id,node(id).title)}<p><span class="text-muted">入口与职责：</span>${esc(node(id).summary)}</p><p><span class="text-muted">${i===0?'开始':'动作与交接'}：</span>${esc(detail)}</p>${claims.map(c=>`<p data-step-claim="${esc(c.layer)}"><span class="text-muted">${esc(source.layer_labels[c.layer])} · ${esc(c.environment)}：</span>${esc(c.statement)}</p>`).join('')}</div></li>`).join('')}</ol><div class="at-callout"><strong>异常与恢复</strong><p>${esc(j.exception)}</p></div>`;}
function renderRelations(n){const selected=data.relations.find(r=>r.id===state.edge);if(selected)return `<div class="at-sectionhead"><h2>${esc(selected.kind)}</h2></div>${relationHtml(selected)}${refs(selected.refs)}`;const p=project(),ids=new Set([n.id,...p.nodes.filter(x=>ancestors(x.id).some(a=>a.id===n.id)).map(x=>x.id)]),rels=p.relations.filter(r=>ids.has(r.from)||ids.has(r.to));return `<div class="at-sectionhead"><h2>关系说明</h2><span class="at-small text-small text-muted">归属、调用和约束分别表达</span></div>${rels.map(r=>`<section class="at-advice-row">${relationHtml(r)}${refs(r.refs)}</section>`).join('')||`<p>尚无已核实的横向关系；这不表示该对象没有依赖。</p>`}`;}
function renderEvolution(n){const entries=project().evolution.filter(e=>n.id===project().root||e.nodes.some(id=>ancestors(id).some(a=>a.id===n.id))||e.nodes.includes(n.id));return `<div class="at-sectionhead"><h2>为什么走到今天</h2></div><div class="at-timeline">${entries.map(e=>`<section><span class="text-small text-muted">${esc(e.date)}</span><h3>${esc(e.title)}</h3><p><span class="text-muted">此前对象：</span>${esc(e.before)}</p><p><span class="text-muted">后续对象与相关判断：</span>${esc(e.choice)} ${esc(e.tradeoff)}</p><div>${e.nodes.map(id=>button(id,node(id).title)).join(' · ')}</div><details><summary class="cursor-interaction">依据</summary>${refs(e.refs)}</details></section>`).join('')||'<p>没有足够来源解释这一对象的演进原因，保留当前已知职责。</p>'}</div>`;}
function renderEvidence(n){const p=project();return `<div class="at-sectionhead"><h2>依据与环境</h2><span class="at-small text-small text-muted">当前源码 · 历史运行分开</span></div><div class="table-responsive"><table class="table at-table"><thead><tr><th>维度</th><th>已有依据</th><th>不能据此推断</th></tr></thead><tbody>${p.matrix.filter(r=>r[5].some(id=>relatedScope([id],n.id))).map(r=>`<tr><td>${r[4]==='node'?button(r[3],r[0]):`<button type="button" class="btn btn-ghost" data-edge="${esc(r[3])}">${esc(r[0])}</button>`}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')||`<tr><td>当前对象</td><td>${esc(n.role)}已有设计依据</td><td>${esc(n.unknown)}</td></tr>`}</tbody></table></div>${n.id===p.root?`<div class="at-reading">${map.coverage.map(c=>`<section><h3>${esc(c.dimension)} · ${esc(source.coverage_labels[c.status])}</h3><p>${esc(c.explanation)}</p></section>`).join('')}</div>`:''}<div class="at-crosslinks"><h3>可追溯来源</h3>${refs(n.refs)}</div>`;}
function renderAdvice(n){const p=project();let a=advice(state.advice);if(!a){const list=p.advice.filter(x=>x.parent===null&&adviceMatches(x,n.id));return `<div class="at-sectionhead"><h2>从整体取舍，逐层审阅</h2></div><p class="text-muted">大范围重构可以讨论。每层分别说明依据、备选方案与实施条件，不因展开或选择而获准实施。</p>${list.map(x=>`<section class="at-advice-row"><span class="at-small text-small text-muted">${esc(x.level)} · 收益待验证</span><button type="button" class="btn btn-ghost cursor-interaction" data-advice="${esc(x.id)}">${esc(x.title)} ↗</button><p>${esc(x.recommend)}</p><span class="at-small text-small text-muted">涉及：${x.scope.map(id=>esc(node(id).title)).join('、')}</span></section>`).join('')||`<div class="at-callout">当前没有针对这一对象的独立增量。保留现状依据，可回到整体建议检查关联影响。</div>`}`;}
const chain=[];for(let x=a;x;x=x.parent?advice(x.parent):null)chain.unshift(x);const sub=p.advice.filter(x=>x.parent===a.id);return `<div class="at-advice-path"><button type="button" class="btn btn-ghost at-link cursor-interaction" data-advice="">全部建议</button>${chain.map(x=>`<span>/</span><button type="button" class="btn btn-ghost at-link cursor-interaction" data-advice="${esc(x.id)}" ${x.id===a.id?'aria-current="page"':''}>${esc(x.level)}</button>`).join('')}</div><div class="at-sectionhead"><h2>${esc(a.title)}</h2><span class="at-small text-small text-muted">讨论候选 · 未实施</span></div><div class="at-reading"><section><h3>为什么值得审视</h3><p>${esc(a.basis)}</p><p><span class="text-muted">用户成本：</span>${esc(a.userCost)}</p></section><section><h3>建议与备选方案</h3><p>${esc(a.recommend)}</p><p class="at-small text-small text-muted">${esc(a.disposition)}</p><p><span class="text-muted">当前：</span>${esc(a.before)}</p><p><span class="text-muted">调整后：</span>${esc(a.after)}</p><div class="at-choices">${a.options.map((x,i)=>`<div class="at-choice"><strong>${esc(x[0])}</strong><p>${esc(x[1])}</p></div>`).join('')}</div></section><section><h3>收益、代价与反例</h3><p>${esc(a.benefit)}</p><p><span class="text-muted">代价：</span>${esc(a.cost)}</p><p><span class="text-muted">保留或删除的条件：</span>${esc(a.counter)}</p></section><section><h3>影响哪些职责</h3><div>${a.scope.map(id=>button(id,node(id).title)).join(' · ')}</div><p class="at-small text-small text-muted">维护归属：${esc(a.owner)}</p></section>${sub.length?`<section><h3>继续向下一层</h3>${sub.map(x=>`<div class="at-advice-row"><span class="at-small text-small text-muted">${esc(x.level)} · 可单独讨论</span><button type="button" class="btn btn-ghost cursor-interaction" data-advice="${esc(x.id)}">${esc(x.title)} ↗</button><p>${esc(x.recommend)}</p></div>`).join('')}</section>`:''}<details><summary class="cursor-interaction">验证条件与依据</summary><p>${esc(a.verify)}</p>${refs(a.refs)}</details></div>`;}
let graphObserver;
function render(){
 graphObserver?.disconnect();const p=project(),n=node(state.node);
 const selectedJourney=data.journeys.find(j=>j.id===state.journey);
 if(selectedJourney){const raw=map.journeys.find(j=>j.id===selectedJourney.id);const matches=state.edge?raw.edge_ids.includes(state.edge):state.advice?raw.card_ids.includes(state.advice)||selectedJourney.steps.some(([id])=>adviceMatches(advice(state.advice),id)):applicableJourneys(n).some(j=>j.id===state.journey);if(!matches)state.journey=null;}
 // Commit the actually visible default before optional persistence or continuation.
 if(state.view==='path'||state.view==='structure'&&state.node===p.root)state.journey=visibleJourney(n)?.id||null;
 qs('.at-breadcrumb').innerHTML=(history.length?'<button type="button" class="btn btn-ghost at-link cursor-interaction" data-action="back">← 返回上一处</button><span aria-hidden="true">·</span>':'')+breadcrumbs(n.id).map((x,i)=>`${i?'<span aria-hidden="true">/</span>':''}${button(x.id,x.id===p.root?p.name:x.title,'at-link',x.id===n.id?'aria-current="page"':'')}`).join('');
 qs('.at-breadcrumb').hidden=n.id===p.root&&!history.length;
 qs('.at-header').innerHTML=`<h1>${esc(n.title)}</h1><p>${esc(n.summary)}</p><details><summary class="at-small text-small text-muted">本次依据与范围</summary><div class="at-meta"><span>来源 ${esc(p.revision.slice(0,7))}</span><span>读取于 ${esc(p.observed_at)}</span><span>${source.purpose==='inspect'?'当前设计查看 · 未做近期复盘':'深度复盘 · 覆盖边界见依据'}</span></div></details>`;
 const tab=([id,label])=>`<button type="button" class="btn btn-ghost cursor-interaction" data-view="${id}" aria-pressed="${state.view===id}">${label}</button>`;
 qs('.at-lenses').innerHTML=views.slice(0,3).map(tab).join('')+`<details ${views.slice(3).some(([id])=>id===state.view)?'open':''}><summary class="cursor-interaction">深入查看</summary>${views.slice(3).map(tab).join(' · ')}</details>`;
 const renderers={structure:renderStructure,path:renderPath,graph:renderGraph,relations:renderRelations,evolution:renderEvolution,evidence:renderEvidence,advice:renderAdvice};qs('.at-content').innerHTML=renderers[state.view](n);
 if(state.view==='graph'){drawGraph();graphObserver=new ResizeObserver(drawGraph);graphObserver.observe(qs('.at-network'));}
 const first=p.advice.find(a=>a.parent===null&&adviceMatches(a,n.id)),teaser=qs('.at-advice-teaser');teaser.hidden=state.view==='advice'||state.view==='graph';
 teaser.innerHTML=first?`<span class="at-small text-small text-muted">关联建议</span><button type="button" class="btn btn-ghost cursor-interaction" data-advice="${esc(first.id)}">${esc(first.title)} ↗</button><p>${esc(first.benefit)}</p>`:`<p class="at-small text-small text-muted">当前无独立改动建议。${esc(n.keep)}</p>`;status('');
}
root.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b||!root.contains(b))return;
 if(b.dataset.expand){go({expanded:[...new Set([...state.expanded,b.dataset.expand])]});return;}
 if(b.dataset.action==='collapse'){go({expanded:[]});return;}
 if(b.dataset.edge){go({edge:b.dataset.edge,view:'relations',advice:null});return;}
 if(b.dataset.node){go({node:b.dataset.node,view:'structure',advice:null,edge:null});return;}
 if(b.dataset.view){go({view:b.dataset.view,advice:null,edge:null});return;}
 if(Object.hasOwn(b.dataset,'advice')){go({view:'advice',advice:b.dataset.advice||null});return;}
 if(b.dataset.action==='back'){if(history.length){state=history.pop();render();focusLocation();persist();}return;}
 if(b.dataset.action==='discuss'){
  const n=node(state.node),a=advice(state.advice),[kind,id]=selection(),selected=kind+':'+id,label=a?.title||(state.edge?map.edges.find(e=>e.id===state.edge).label:n.title);
  const prompt=`请继续讨论已交付的 Scout 结果：报告 ${source.report_hash}；工程 ${source.project_key}；来源版本 ${data.revision}；上下文 ${source.context_snapshot_hash}；对象 ${selected}「${label}」；视角 ${state.view}；路径 ${state.journey||'未选择'}。请从当前聊天恢复对应完整交付回执和原文件，将上述对象与路径作为 verify-final 的 --object 和 --journey 参数数据核对，沿同一证据解释并承接讨论；不要重跑普查，不要将本次讨论视为写入授权。`;
  const fallback=`报告 ${source.report_hash}；工程 ${source.project_key}；对象 ${selected}；路径 ${state.journey||'未选择'}。可复制这些信息，在当前聊天继续讨论。`;
  if(!window.openai?.sendFollowUpMessage){status('当前端未提供原生续接。'+fallback);return;}
  b.disabled=true;try{await window.openai.sendFollowUpMessage({prompt,title:`讨论：${label}`});status('已交给原生后续消息入口；是否实际发送及后续采用，以聊天中的结果为准。');}catch{status('原生续接未完成，选择保留。'+fallback);}finally{b.disabled=false;}
 }
});
root.addEventListener('change',e=>{if(e.target.id==='atlas-journey')go({journey:e.target.value});if(e.target.id==='atlas-relation')go({relation:e.target.value});});
restore(window.openai?.widgetState);render();
window.addEventListener('openai:set_globals',e=>{if(restore(e.detail?.globals?.widgetState))render();});
})();
</script>
