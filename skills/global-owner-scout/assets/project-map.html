<script type="application/json" id="atlas-data">__SCOUT_DATA__</script>
<script>
(()=>{
const root=document.getElementById('__SCOUT_ROOT__');
const source=JSON.parse(root.querySelector('#atlas-data').textContent);
// Presentation projection only: every fact and identity comes from the frozen map.
const map=source.project_map, ids=new Set(map.nodes.map(n=>n.id));
let overview='overview';while(ids.has(overview))overview+='-';
const evidence=Object.fromEntries(source.evidence_sources.flatMap(s=>s.refs.map(r=>[r.ref,{type:r.type,section:r.ref,text:r.summary,path:r.ref}])));
const statements=(n,layers)=>n.claims.filter(c=>layers.includes(c.layer)).map(c=>`${source.layer_labels[c.layer]}：${c.statement}`).join(' ');
const nodes=map.nodes.map(n=>{const parents=map.edges.filter(e=>e.kind==='contains'&&e.target===n.id).map(e=>e.source);return {
 id:n.id,parents:parents.length?parents:[overview],title:n.label,role:n.kind,summary:n.summary,
 why:statements(n,['design','inference'])||n.summary,keep:`维护归属：${n.owner}。${statements(n,['implementation','observed'])}`,
 unknown:statements(n,['unknown'])||'已知事实限于所列来源；不能据此宣称其他环境或后续采用。',refs:[...new Set([...n.evidence_refs,...n.claims.flatMap(c=>c.evidence_refs)])]};});
nodes.unshift({id:overview,parents:[],title:map.title,role:'工程目标与边界',summary:map.goal,why:map.boundary,
 keep:'本轮没有新增建议不代表缺少工程全貌。',unknown:map.coverage.map(c=>c.explanation).join(' '),refs:[...new Set(map.nodes.flatMap(n=>n.evidence_refs))]});
const scopeFor=id=>[...new Set([...map.nodes.filter(n=>n.card_ids.includes(id)).map(n=>n.id),...map.edges.filter(e=>e.card_ids.includes(id)).flatMap(e=>[e.source,e.target]),...map.journeys.filter(j=>j.card_ids.includes(id)).flatMap(j=>[j.entry,...j.edge_ids.map(id=>map.edges.find(e=>e.id===id).target)])])];
const data={name:map.title,root:overview,revision:map.source_revision,observed_at:map.observed_at,sources:evidence,nodes,
 relations:map.edges.map(e=>({id:e.id,from:e.source,to:e.target,kind:source.relation_labels[e.kind]||'已知关系',detail:e.label+'。'+e.claims.map(c=>`${source.layer_labels[c.layer]} · ${c.environment}：${c.statement}`).join(' '),refs:[...new Set([...e.evidence_refs,...e.claims.flatMap(c=>c.evidence_refs)])]})),
 journeys:map.journeys.map(j=>({id:j.id,title:j.label,result:j.outcome,exception:j.recovery,steps:[[j.entry,'场景入口'],...j.edge_ids.map(id=>{const e=map.edges.find(e=>e.id===id);return [e.target,e.label];})]})),
 evolution:map.edges.filter(e=>e.kind==='evolves').map(e=>({date:'演进依据',title:e.label,before:map.nodes.find(n=>n.id===e.source).summary,
  choice:map.nodes.find(n=>n.id===e.target).summary,tradeoff:e.claims.map(c=>`${source.layer_labels[c.layer]} · ${c.environment}：${c.statement}`).join(' '),nodes:[e.source,e.target],refs:[...new Set([...e.evidence_refs,...e.claims.flatMap(c=>c.evidence_refs)])]})),
 matrix:[...map.nodes,...map.edges.map(e=>({...e,id:e.source}))].flatMap(n=>n.claims.map(c=>[`${n.label} · ${c.environment} · ${source.layer_labels[c.layer]}`,c.statement,c.layer==='unknown'?'本项未证。':'仅支持本项声明，安装、启用、执行与采用分别核对。',n.id])),
 advice:source.advice.filter(a=>a.recommended_action!=='ignore').map(a=>({id:a.card_id,parent:a.parent_card_id||null,title:a.title,level:a.parent_card_id?'下层方案':'整体建议',
  scope:scopeFor(a.card_id).length?scopeFor(a.card_id):[overview],basis:a.human_context.project_story,recommend:a.recommendation,userCost:a.human_context.user_cost,before:a.human_context.concrete_before,after:a.human_context.concrete_after,disposition:a.recommended_action_reason,
  options:a.alternatives?.map(o=>[o.approach,o.tradeoff])||[['当前处理',a.recommended_action_reason]],
  benefit:a.benefit_hypothesis||a.human_context.concrete_after,cost:a.implementation_cost||a.human_context.user_cost,
  counter:[...new Set([a.human_context.strongest_counterpoint,...(a.anti_examples||[])])].join(' '),owner:a.owner_rationale,verify:[...(a.validation_conditions||[]),...a.unproven].join(' '),refs:a.direct_evidence?.map(e=>e.ref)||a.human_context.evidence_refs}))};
const qs=s=>root.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={node:data.root,view:'structure',advice:null,journey:null,edge:null}, history=[];
const views=[['structure','结构'],['path','执行路径'],['relations','横向关联'],['evolution','演进'],['evidence','依据'],['advice','建议']];
const project=()=>data, node=id=>project().nodes.find(x=>x.id===id), advice=id=>project().advice.find(x=>x.id===id);
const button=(id,label,cls='at-link',extra='')=>`<button type="button" class="${cls} cursor-interaction" data-node="${esc(id)}" ${extra}>${esc(label)}</button>`;
const children=id=>data.nodes.filter(x=>x.parents.includes(id));
function ancestors(id){const found=new Map(),pending=[id];while(pending.length){const n=node(pending.pop());if(!n||found.has(n.id))continue;found.set(n.id,n);pending.push(...n.parents);}return [...found.values()].reverse();}
function breadcrumbs(id){const path=[];for(let n=node(id);n;n=n.parents.length?node(n.parents[0]):null)path.unshift(n);return path;}
function relatedScope(scope,id){return scope.includes(id)||ancestors(id).some(n=>scope.includes(n.id))||scope.some(s=>ancestors(s).some(n=>n.id===id));}
function adviceMatches(item,nodeId){const pending=[item];while(pending.length){const a=pending.pop();if(relatedScope(a.scope,nodeId))return true;pending.push(...data.advice.filter(x=>x.parent===a.id));}return false;}
function refs(ids){return [...new Set(ids)].map(id=>{const s=project().sources[id];return s?`<details class="at-source"><summary>${esc(s.type)} · ${esc(s.section)}</summary><p>${esc(s.text)}</p><code>${esc(s.path)}</code><p class="at-small">源码 ${esc(project().revision.slice(0,7))} · 本次读取 ${esc(project().observed_at)}</p></details>`:''}).join('');}
function status(msg){qs('.at-status').textContent=msg;}
function snapshot(){return {modelContent:{report_hash:source.report_hash,project_key:source.project_key,source_revision:data.revision,context_snapshot_hash:source.context_snapshot_hash,object_kind:state.edge?'edge':'node',object_id:state.edge||state.node,advice_id:state.advice,view:state.view},privateContent:{state:{...state},returnTo:history.at(-1)||null}};}
function persist(){try{if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState(snapshot())).catch(()=>{});}catch{/* Optional persistence never blocks local reading. */}}
function normalizeState(s){if(!s||!node(s.node)||!views.some(v=>v[0]===s.view)||s.advice&&!advice(s.advice))return null;return {node:s.node,view:s.view,advice:s.advice||null,journey:data.journeys.some(j=>j.id===s.journey)?s.journey:null,edge:data.relations.some(r=>r.id===s.edge)?s.edge:null};}
function restore(value){const s=value?.privateContent?.state,m=value?.modelContent;if(!s||m?.report_hash!==source.report_hash||m?.project_key!==source.project_key||m?.source_revision!==data.revision||m?.context_snapshot_hash!==source.context_snapshot_hash)return false;const next=normalizeState(s);if(!next)return false;if(JSON.stringify(next)===JSON.stringify(state))return false;state=next;const previous=normalizeState(value.privateContent.returnTo);history=previous?[previous]:[];return true;}
function focusLocation(){const control=state.view==='advice'&&state.advice?qs('.at-advice-path [aria-current="page"]'):qs('.at-lenses [aria-pressed="true"]');control?.focus({preventScroll:true});}
function go(next){const updated={...state,...next};if(JSON.stringify(updated)===JSON.stringify(state))return;history.push({...state});state=updated;render();focusLocation();persist();}
function relationHtml(r){return `<div class="at-relation">${button(r.from,node(r.from).title)}<button class="at-link cursor-interaction" data-edge="${esc(r.id)}">${esc(r.kind)} →</button>${button(r.to,node(r.to).title)}</div><p class="at-small">${esc(r.detail)}</p>`;}
function renderStructure(n){const p=project(),kids=children(n.id);let html='';if(n.id===p.root){html+=`<div class="at-intent"><span class="at-small">理解主线</span><p>${esc(n.why)}</p></div><div class="at-sectionhead"><h2>整体分工</h2><span class="at-small">选择能力，继续深入</span></div><div class="at-branches">`;for(const k of kids)html+=`<section class="at-branch"><button class="cursor-interaction" data-node="${esc(k.id)}"><span class="at-small">${esc(k.role)}</span><h3>${esc(k.title)} ↗</h3></button><div class="at-children">${children(k.id).map(c=>`<button class="cursor-interaction" data-node="${esc(c.id)}"><span>${esc(c.title)}</span><span class="at-small">${esc(c.role)}</span></button>`).join('')}</div></section>`;html+='</div>';const rels=p.relations.filter(r=>kids.some(k=>k.id===r.from)&&kids.some(k=>k.id===r.to));html+=`<div class="at-crosslinks"><span class="at-small">这些分工如何连接</span>${rels.map(relationHtml).join('')}</div>`;}else{html+=`<div class="at-intent"><span class="at-small">为何需要这一层</span><p>${esc(n.why)}</p></div>`;if(kids.length)html+=`<div class="at-sectionhead"><h2>内部职责</h2></div><div class="at-node-list">${kids.map(k=>`<button class="cursor-interaction" data-node="${esc(k.id)}"><h3>${esc(k.title)}</h3><span aria-hidden="true">↗</span><p>${esc(k.summary)}</p></button>`).join('')}</div>`;else html+=`<div class="at-reading"><section><h3>当前实现与维护归属</h3><p>${esc(n.keep)}</p></section><section><h3>已知范围与缺口</h3><p>${esc(n.unknown)}</p></section></div>`;const rels=p.relations.filter(r=>r.from===n.id||r.to===n.id);if(rels.length)html+=`<div class="at-crosslinks"><span class="at-small">与其他职责相连</span>${rels.map(relationHtml).join('')}</div>`;}return html;}
function renderPath(n){const p=project(),candidates=p.journeys.filter(j=>n.id===p.root||j.steps.some(([id])=>ancestors(id).some(a=>a.id===n.id)));if(!candidates.length)return `<div class="at-callout"><p>已知职责尚未关联到一条完整执行路径。</p><p class="at-small">保留当前结构与依据，不补造执行顺序。</p></div>`;const j=candidates.find(x=>x.id===state.journey)||candidates[0];return `<div class="at-sectionhead"><h2>从场景走到结果</h2><select aria-label="选择执行场景" id="atlas-journey">${candidates.map(x=>`<option value="${esc(x.id)}" ${x.id===j.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><p>${esc(j.result)}</p><ol class="at-steps">${j.steps.map(([id,detail])=>`<li><div>${button(id,node(id).title)}<p>${esc(detail)}</p></div></li>`).join('')}</ol><div class="at-callout"><strong>异常与恢复</strong><p>${esc(j.exception)}</p></div>`;}
function renderRelations(n){const selected=data.relations.find(r=>r.id===state.edge);if(selected)return `<div class="at-sectionhead"><h2>${esc(selected.kind)}</h2></div>${relationHtml(selected)}${refs(selected.refs)}`;const p=project(),ids=new Set([n.id,...p.nodes.filter(x=>ancestors(x.id).some(a=>a.id===n.id)).map(x=>x.id)]),rels=p.relations.filter(r=>ids.has(r.from)||ids.has(r.to));return `<div class="at-sectionhead"><h2>关系说明</h2><span class="at-small">归属、调用和约束分别表达</span></div>${rels.map(r=>`<section class="at-advice-row">${relationHtml(r)}${refs(r.refs)}</section>`).join('')||`<p>尚无已核实的横向关系；这不表示该对象没有依赖。</p>`}`;}
function renderEvolution(n){const entries=project().evolution.filter(e=>n.id===project().root||e.nodes.some(id=>ancestors(id).some(a=>a.id===n.id))||e.nodes.includes(n.id));return `<div class="at-sectionhead"><h2>为什么走到今天</h2></div><div class="at-timeline">${entries.map(e=>`<section><span class="at-date">${esc(e.date)}</span><h3>${esc(e.title)}</h3><p><span class="at-muted">此前对象：</span>${esc(e.before)}</p><p><span class="at-muted">后续对象与相关判断：</span>${esc(e.choice)} ${esc(e.tradeoff)}</p><div>${e.nodes.map(id=>button(id,node(id).title)).join(' · ')}</div><details><summary>依据</summary>${refs(e.refs)}</details></section>`).join('')||'<p>没有足够来源解释这一对象的演进原因，保留当前已知职责。</p>'}</div>`;}
function renderEvidence(n){const p=project();return `<div class="at-sectionhead"><h2>依据与环境</h2><span class="at-small">当前源码 · 历史运行分开</span></div><table class="at-table"><thead><tr><th>维度</th><th>已有依据</th><th>不能据此推断</th></tr></thead><tbody>${p.matrix.filter(r=>n.id===p.root||ancestors(r[3]).some(a=>a.id===n.id)||ancestors(n.id).some(a=>a.id===r[3])).map(r=>`<tr><td>${button(r[3],r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')||`<tr><td>当前对象</td><td>${esc(n.role)}已有设计依据</td><td>${esc(n.unknown)}</td></tr>`}</tbody></table>${n.id===p.root?`<div class="at-reading">${map.coverage.map(c=>`<section><h3>${esc(c.dimension)} · ${esc(source.coverage_labels[c.status])}</h3><p>${esc(c.explanation)}</p></section>`).join('')}</div>`:''}<div class="at-crosslinks"><h3>可追溯来源</h3>${refs(n.refs)}</div>`;}
function renderAdvice(n){const p=project();let a=advice(state.advice);if(!a){const list=p.advice.filter(x=>x.parent===null&&adviceMatches(x,n.id));return `<div class="at-sectionhead"><h2>从整体取舍，逐层审阅</h2></div><p class="at-muted">大范围重构可以讨论。每层分别说明依据、备选方案与实施条件，不因展开或选择而获准实施。</p>${list.map(x=>`<section class="at-advice-row"><span class="at-small">${esc(x.level)} · 收益待验证</span><button class="cursor-interaction" data-advice="${esc(x.id)}">${esc(x.title)} ↗</button><p>${esc(x.recommend)}</p><span class="at-small">涉及：${x.scope.map(id=>esc(node(id).title)).join('、')}</span></section>`).join('')||`<div class="at-callout">当前没有针对这一对象的独立增量。保留现状依据，可回到整体建议检查关联影响。</div>`}`;}
const chain=[];for(let x=a;x;x=x.parent?advice(x.parent):null)chain.unshift(x);const sub=p.advice.filter(x=>x.parent===a.id);return `<div class="at-advice-path"><button class="at-link cursor-interaction" data-advice="">全部建议</button>${chain.map(x=>`<span>/</span><button class="at-link cursor-interaction" data-advice="${esc(x.id)}" ${x.id===a.id?'aria-current="page"':''}>${esc(x.level)}</button>`).join('')}</div><div class="at-sectionhead"><h2>${esc(a.title)}</h2><span class="at-small">讨论候选 · 未实施</span></div><div class="at-reading"><section><h3>为什么值得审视</h3><p>${esc(a.basis)}</p><p><span class="at-muted">用户成本：</span>${esc(a.userCost)}</p></section><section><h3>建议与备选方案</h3><p>${esc(a.recommend)}</p><p class="at-small">${esc(a.disposition)}</p><p><span class="at-muted">当前：</span>${esc(a.before)}</p><p><span class="at-muted">调整后：</span>${esc(a.after)}</p><div class="at-choices">${a.options.map((x,i)=>`<div class="at-choice"><strong>${esc(x[0])}</strong><p>${esc(x[1])}</p></div>`).join('')}</div></section><section><h3>收益、代价与反例</h3><p>${esc(a.benefit)}</p><p><span class="at-muted">代价：</span>${esc(a.cost)}</p><p><span class="at-muted">保留或删除的条件：</span>${esc(a.counter)}</p></section><section><h3>影响哪些职责</h3><div>${a.scope.map(id=>button(id,node(id).title)).join(' · ')}</div><p class="at-small">维护归属：${esc(a.owner)}</p></section>${sub.length?`<section><h3>继续向下一层</h3>${sub.map(x=>`<div class="at-advice-row"><span class="at-small">${esc(x.level)} · 可单独讨论</span><button class="cursor-interaction" data-advice="${esc(x.id)}">${esc(x.title)} ↗</button><p>${esc(x.recommend)}</p></div>`).join('')}</section>`:''}<details><summary>验证条件与依据</summary><p>${esc(a.verify)}</p>${refs(a.refs)}</details></div>`;}
function render(){const p=project(),n=node(state.node);qs('.at-breadcrumb').innerHTML=(history.length?'<button class="at-link cursor-interaction" data-action="back">← 返回上一处</button><span aria-hidden="true">·</span>':'')+breadcrumbs(n.id).map((x,i)=>`${i?'<span aria-hidden="true">/</span>':''}${button(x.id,x.id===p.root?p.name:x.title,'at-link',x.id===n.id?'aria-current="page"':'')}`).join('');qs('.at-header').innerHTML=`<span class="at-kicker">${esc(n.role)}</span><h1>${esc(n.title)}</h1><p>${esc(n.summary)}</p><div class="at-meta"><span>来源 ${esc(p.revision.slice(0,7))}</span><span>读取于 ${esc(p.observed_at)}</span><span>${source.purpose==='inspect'?'当前设计查看 · 未做近期复盘':'深度复盘 · 覆盖边界见依据'}</span></div>`;qs('.at-lenses').innerHTML=views.map(([id,label])=>`<button class="cursor-interaction" data-view="${id}" aria-pressed="${state.view===id}">${label}</button>`).join('');const renderers={structure:renderStructure,path:renderPath,relations:renderRelations,evolution:renderEvolution,evidence:renderEvidence,advice:renderAdvice};qs('.at-content').innerHTML=renderers[state.view](n);const first=p.advice.find(a=>a.parent===null&&adviceMatches(a,n.id));const teaser=qs('.at-advice-teaser');teaser.hidden=state.view==='advice';teaser.innerHTML=first?`<span class="at-small">关联建议 · 可从系统取舍逐层深入</span><button class="cursor-interaction" data-advice="${esc(first.id)}">${esc(first.title)} ↗</button><p>${esc(first.benefit)}</p>`:`<p class="at-small">当前无独立改动建议。${esc(n.keep)}</p>`;status('');}
root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.edge){go({edge:b.dataset.edge,view:'relations',advice:null});return;}if(b.dataset.node){go({node:b.dataset.node,view:'structure',advice:null,journey:qs('#atlas-journey')?.value||state.journey,edge:null});return;}if(b.dataset.view){go({view:b.dataset.view,advice:null,edge:null});return;}if(Object.hasOwn(b.dataset,'advice')){go({view:'advice',advice:b.dataset.advice||null});return;}if(b.dataset.action==='back'){if(history.length){state=history.pop();render();focusLocation();persist();}return;}if(b.dataset.action==='discuss'){const p=project(),n=node(state.node),a=advice(state.advice);const prompt=`请继续讨论已交付的 Scout 结果：报告 ${source.report_hash}；工程 ${source.project_key}；来源版本 ${data.revision}；上下文 ${source.context_snapshot_hash}；对象 ${state.edge?'edge:'+state.edge:'node:'+n.id}「${n.title}」；视角 ${state.view}；路径 ${state.journey||'未选择'}${a?`；建议 ${a.id}「${a.title}」`:''}。请从当前聊天恢复对应完整交付回执和原文件，沿同一证据解释并承接讨论；不要重跑普查，不要将本次讨论视为写入授权。`;if(!window.openai?.sendFollowUpMessage){status(`当前端未提供原生续接。可在此聊天说「继续讨论 ${p.name} / ${a?a.title:n.title}」；报告 ${source.report_hash}，对象 ${a?a.id:state.edge?'edge:'+state.edge:'node:'+n.id}。`);return;}b.disabled=true;try{await window.openai.sendFollowUpMessage({prompt,title:a?`讨论：${a.title}`:`讨论：${n.title}`});status('已交给原生后续消息入口；是否实际发送及后续采用，以聊天中的结果为准。');}catch{status(`原生续接未完成。选择保留；可在此聊天继续讨论报告 ${source.report_hash} / ${a?a.id:state.edge?'edge:'+state.edge:'node:'+n.id}。`);}finally{b.disabled=false;}}});
root.addEventListener('change',e=>{if(e.target.id==='atlas-journey')go({journey:e.target.value});});
restore(window.openai?.widgetState);render();
window.addEventListener('openai:set_globals',e=>{if(restore(e.detail?.globals?.widgetState))render();});
})();
</script>
