<article class="at-page" aria-label="工程全貌与复盘">
 <section data-overview>
  <header class="at-header"><p class="at-meta" data-purpose></p><h2 data-title></h2><p class="at-heading-copy" data-goal></p></header>
  <section class="at-figure" data-primary></section>
  <section class="at-support" data-support></section>
  <details><summary class="cursor-interaction">工程范围、参与者与覆盖边界</summary><div class="at-evidence" data-boundary></div></details>
  <div class="at-bottom"><span class="at-meta" data-snapshot></span><button type="button" data-review class="at-link cursor-interaction">查看建议 →</button></div>
 </section>
 <section data-focus hidden>
  <nav class="at-breadcrumb" aria-label="当前位置"><button type="button" data-home class="cursor-interaction">← 工程全貌</button><span>/</span><span data-location></span></nav>
  <h2 data-focus-title></h2><p class="at-context" data-context></p>
  <div class="at-focus-body" data-path><ol class="at-timeline" aria-label="完整执行路径" data-timeline></ol><section class="at-detail" aria-live="polite" data-detail></section></div>
  <section data-matrix hidden></section>
  <section class="at-advice" data-advice hidden></section>
  <details data-evidence><summary class="cursor-interaction">依据与适用边界</summary><div class="at-evidence" data-sources></div></details>
  <div class="at-bottom"><button type="button" data-discuss class="at-primary-action cursor-interaction">继续讨论此处</button><button type="button" data-view class="at-link cursor-interaction">核对环境与证据</button></div>
  <p class="at-notice" role="status" aria-live="polite" data-status></p>
 </section>
 <noscript>当前环境未启用交互。完整审阅文件保留同一工程全貌、路径、矩阵及来源，可在当前聊天继续讨论。</noscript>
</article>
<script>
(() => {
 const root = document.getElementById('__SCOUT_ROOT__');
 const data = __SCOUT_DATA__, map = data.project_map;
 const q = s => root.querySelector(s);
 const sources = new Map(data.evidence_sources.flatMap(s => s.refs).map(r => [r.ref, r]));
 const objects = {node: new Map(map.nodes.map(n => [n.id, n])), edge: new Map(map.edges.map(e => [e.id, e])), journey: new Map(map.journeys.map(j => [j.id, j])), advice: new Map(data.advice.map(c => [c.card_id, c]))};
 const actionable = data.advice.filter(c => c.recommended_action && c.recommended_action !== 'ignore');
 const ownerLabels = {project_owner:'项目维护', skill:'方法维护', global_agents:'全局规则候选', no_persistence:'无需持久化'};
 const actionLabels = {confirm:'待准确确认', edit:'先澄清或调整', keep_project:'进入项目维护', make_skill:'进入方法维护', ignore:'无需处理'};
 const el = (tag, text, cls) => { const x=document.createElement(tag); if(text !== undefined)x.textContent=text; if(cls)x.className=cls; return x; };
 const button = (kind, id, label, journey='') => {
  const b=el('button',label,'cursor-interaction'); b.type='button'; b.dataset.kind=kind; b.dataset.id=id; b.dataset.journey=journey; return b;
 };
 const steps = journey => [{kind:'node', id:journey.entry}, ...journey.edge_ids.flatMap(id => [{kind:'edge',id}, {kind:'node',id:objects.edge.get(id).target}])];
 const label = s => {const item=objects[s.kind].get(s.id); return item.label || item.title;};
 const itemFor = () => objects[state.selection.kind].get(state.selection.id);
 let state={screen:'overview', journey:map.journeys[0]?.id || '', selection:{kind:'node',id:map.journeys[0]?.entry || map.nodes[0].id}, view:'path'};
 const facts = pairs => { const dl=el('dl'); for(const [name,value] of pairs) if(value)dl.append(el('dt',name),el('dd',value)); return dl; };
 const adviceButtons = ids => {
  const row=el('div',undefined,'at-relationship');
  for(const c of actionable.filter(c => ids.includes(c.card_id)))row.append(button('advice',c.card_id,'建议：'+c.title,state.journey));
  return row;
 };
 function evidence(refs) {
  const list=el('ul');
  for(const ref of [...new Set(refs)])list.append(el('li',ref+'：'+(sources.get(ref)?.summary || '见原报告中的事件或卡片依据。')));
  if(!refs.length)list.append(el('li','尚无直接证据。'));
  return list;
 }
 function renderOverview() {
  q('[data-title]').textContent=map.title; q('[data-goal]').textContent=map.goal;
  q('[data-purpose]').textContent=data.purpose==='inspect'?'SCOUT / 工程全貌 / 当前设计查看':'SCOUT / 工程全貌 / 深度复盘';
  q('[data-snapshot]').textContent='观察于 '+map.observed_at+' · 来源 '+map.source_revision.slice(0,12)+(data.purpose==='inspect'?'。本次未执行近期协作复盘。':'。各项证据与未知分别判断。');
  const primary=q('[data-primary]'), support=q('[data-support]'); primary.replaceChildren(); support.replaceChildren();
  const first=map.journeys[0];
  if(first){
   const heading=el('div',undefined,'at-section-title');heading.append(el('h3',first.label));primary.append(heading); const ol=el('ol',undefined,'at-primary');ol.setAttribute('aria-label',first.label);
   const path=[first.entry,...first.edge_ids.map(id=>objects.edge.get(id).target)];
   path.forEach((id,i)=>{const n=objects.node.get(id),li=el('li'),b=button('node',id,undefined,first.id);b.classList.add('at-node');b.append(el('span',String(i+1).padStart(2,'0'),'at-index'),el('strong',n.label),el('span',i ? "→ " + objects.edge.get(first.edge_ids[i-1]).label : n.kind,'at-meta'));li.append(b);ol.append(li);});
   primary.append(ol,el('p',first.outcome,'at-context-link'));
  }else primary.append(el('p','当前证据尚未建立完整路径，已知能力与缺口保留在下方。'));
  support.hidden=map.journeys.length<2;
  if(!support.hidden){
   const heading=el('div',undefined,'at-support-head');heading.append(el('h3','关联路径'));support.append(heading);const list=el('div',undefined,'at-loop');
   for(const j of map.journeys.slice(1)){const div=el('div',undefined,'at-loop-item'),b=button('journey',j.id,undefined,j.id);b.append(el('strong',j.label),el('span',j.outcome,'at-meta'));div.append(b);list.append(div);}support.append(list);
  }
  const boundary=q('[data-boundary]');boundary.replaceChildren(el('p',map.boundary),el('h4','能力与参与者'));
  const nodes=el('div',undefined,'at-relationship');for(const n of map.nodes)nodes.append(button('node',n.id,n.label+' · '+n.owner));boundary.append(nodes,el('h4','覆盖边界'));
  for(const c of map.coverage){boundary.append(el('p',c.dimension+' · '+data.coverage_labels[c.status]+'：'+c.explanation),evidence(c.evidence_refs));}
  q('[data-review]').hidden=!actionable.length;
 }
 function render() {
  q('[data-overview]').hidden=state.screen!=='overview';q('[data-focus]').hidden=state.screen!=='focus';
  const item=itemFor(), journey=objects.journey.get(state.journey), isAdvice=state.selection.kind==='advice';
  q('[data-location]').textContent=journey?.label || (isAdvice?'维护建议':'能力与关系');
  q('[data-focus-title]').textContent=isAdvice?item.title:(journey?.label || item.label);
  q('[data-context]').textContent=isAdvice?(ownerLabels[item.owner_recommendation] || '见原报告维护归属'):(journey?.outcome || item.summary || item.label);
  q('[data-path]').hidden=isAdvice || state.view!=='path';q('[data-advice]').hidden=!isAdvice;q('[data-matrix]').hidden=isAdvice || state.view!=='matrix';
  q('[data-view]').hidden=isAdvice&&!state.returnTo;q('[data-view]').textContent=isAdvice?'返回所选环节':state.view==='matrix'?'返回当前路径':'核对环境与证据';
  const timeline=q('[data-timeline]');timeline.replaceChildren();
  const sequence=journey?steps(journey):[state.selection];
  const stages=journey?sequence.filter(s=>s.kind==='node'):sequence;
  stages.forEach((s,i)=>{const li=el('li'),b=button(s.kind,s.id,undefined,state.journey);const active=s.kind===state.selection.kind&&s.id===state.selection.id || state.selection.kind==='edge'&&s.id===item.target;b.setAttribute('aria-current',active?'step':'false');b.append(el('span',String(i+1).padStart(2,'0')),el('strong',label(s)));li.append(b);timeline.append(li);});
  const detail=q('[data-detail]');detail.replaceChildren(el('p','当前环节 / '+(journey?.label || '工程关系'),'at-detail-label'),el('h4',label(state.selection)));
  if(!isAdvice){
   detail.append(facts([['职责',item.summary],['维护归属',item.owner],['结果',item.outcome]]));
   if(state.selection.kind==='edge')detail.append(facts([['交接',objects.node.get(item.source).label+' → '+item.label+' → '+objects.node.get(item.target).label]]));
   for(const c of item.claims || [])detail.append(facts([[data.layer_labels[c.layer]+' · '+c.environment,c.statement]]));
   if(journey)detail.append(el('p','恢复与例外：'+journey.recovery,'at-recovery'));
   const related=el('div',undefined,'at-relationship'),others=el('div',undefined,'at-relationship');
   if(state.selection.kind==='node')for(const e of map.edges.filter(e=>e.source===item.id||e.target===item.id)){
    const target=!journey||journey.edge_ids.includes(e.id)?related:others;
    target.append(button('edge',e.id,objects.node.get(e.source).label+' → '+e.label+' → '+objects.node.get(e.target).label,state.journey));
   }
   if(state.selection.kind==='edge')for(const id of [item.source,item.target])related.append(button('node',id,objects.node.get(id).label,state.journey));
   for(const j of map.journeys.filter(j=>j.id!==state.journey&&steps(j).some(s=>s.kind===state.selection.kind&&s.id===state.selection.id)))others.append(button('journey',j.id,'关联路径：'+j.label,j.id));
   detail.append(related);
   if(others.childElementCount){const more=el('details');more.append(el('summary','其他关联路径'),others);detail.append(more);}
   detail.append(adviceButtons([...new Set([...(item.card_ids || []),...(journey?.card_ids || [])])]));
  }
  const matrix=q('[data-matrix]');matrix.replaceChildren();
  const table=el('table',undefined,'at-table'),head=el('thead'),tr=el('tr');
  for(const title of ['对象 / 归属','证据层次 / 环境','事实与未证范围']){const th=el('th',title);th.scope='col';tr.append(th);}head.append(tr);table.append(head);
  const tbody=el('tbody'), seen=new Set();
  for(const s of sequence){const key=s.kind+':'+s.id;if(seen.has(key))continue;seen.add(key);const obj=objects[s.kind].get(s.id);
   for(const c of obj.claims || []){const row=el('tr'),name=el('th');name.scope='row';name.append(button(s.kind,s.id,obj.label,state.journey));if(obj.owner)name.append(el('p',obj.owner,'at-meta'));const content=el('td',c.statement);const more=el('details');more.append(el('summary','来源'),evidence(c.evidence_refs));content.append(more);row.append(name,el('td',data.layer_labels[c.layer]+' · '+c.environment),content);tbody.append(row);}}
  table.append(tbody);matrix.append(table);
  const advice=q('[data-advice]');advice.replaceChildren();
  if(isAdvice){const h=item.human_context;
   advice.append(el('p',(actionLabels[item.recommended_action] || '见原报告')+'。'+(item.recommended_action_reason || ''),'at-meta'));
   if(h)advice.append(facts([['用户成本',h.user_cost],['当前',h.concrete_before],[item.recommended_action==='edit'?'项目原建议':'建议',h.recommended_outcome],['调整后',h.concrete_after],['维护归属',item.owner_rationale],['例外与风险',h.strongest_counterpoint],['未证范围',(item.unproven || []).join('；')]]));
   else advice.append(el('p',item.recommendation),el('p','详细变化与例外请从同一原报告恢复，旧报告不补造新字段。','at-meta'));
   advice.append(adviceButtons(actionable.filter(c=>c.card_id!==item.card_id).map(c=>c.card_id)));
  }
  const refs=isAdvice?(item.human_context?.evidence_refs || []):[...(item.evidence_refs || []),...(item.claims || []).flatMap(c=>c.evidence_refs),...(journey?.evidence_refs || [])];
  q('[data-sources]').replaceChildren(evidence(refs));q('[data-status]').textContent='';
 }
 function save(){try{Promise.resolve(window.openai?.setWidgetState?.({modelContent:{report_hash:data.report_hash,selection:state.selection},privateContent:{screen:state.screen,journey:state.journey,view:state.view,returnTo:state.returnTo || null}})).catch(()=>{});}catch{ /* convenience only */ }}
 function restore(value){
  const content=value?.modelContent,next=content?.selection;
  if(content?.report_hash!==data.report_hash||!Object.hasOwn(objects,next?.kind)||!objects[next.kind].has(next.id))return false;
  const saved=value.privateContent || {}, journey=objects.journey.get(saved.journey);
  state={selection:{kind:next.kind,id:next.id},screen:saved.screen==='overview'?'overview':'focus',journey:journey&&steps(journey).some(s=>s.kind===next.kind&&s.id===next.id)?journey.id:'',view:saved.view==='matrix'?'matrix':'path'};
  if(next.kind==='journey')state.journey=next.id;
  if(next.kind==='advice'&&journey)state.journey=journey.id;
  const previous=saved.returnTo, selection=previous?.selection;
  if(next.kind==='advice'&&['node','edge','journey'].includes(selection?.kind)&&objects[selection.kind].has(selection.id)){
   const path=objects.journey.get(previous.journey);
   state.returnTo={selection:{kind:selection.kind,id:selection.id},journey:path&&(selection.kind==='journey'?selection.id===path.id:steps(path).some(s=>s.kind===selection.kind&&s.id===selection.id))?path.id:''};
  }
  return true;
 }
 function select(kind,id,journeyId){
  const returnTo=kind==='advice'?(state.selection.kind==='advice'?state.returnTo:state.screen==='focus'?{selection:{...state.selection},journey:state.journey}:null):null;
  const associated=map.journeys.filter(j=>steps(j).some(s=>s.kind===kind&&s.id===id));
  const journey=kind==='journey'?id:(associated.find(j=>j.id===journeyId)?.id || associated[0]?.id || '');
  state={screen:'focus',selection:{kind,id},journey:kind==='advice'?journeyId || '':journey,view:'path',returnTo};
 }
 root.addEventListener('click',event=>{
  const b=event.target.closest('button');if(!b||!root.contains(b)||b.hasAttribute('data-discuss'))return;
  if(b.hasAttribute('data-kind'))select(b.dataset.kind,b.dataset.id,b.dataset.journey);
  else if(b.hasAttribute('data-home'))state.screen='overview';
  else if(b.hasAttribute('data-review'))select('advice',actionable[0].card_id,'');
  else if(b.hasAttribute('data-view')){if(state.selection.kind==='advice'&&state.returnTo){const back=state.returnTo;state={...state,...back,view:'path',returnTo:null};}else state.view=state.view==='matrix'?'path':'matrix';}else return;
  const fromTimeline=Boolean(b.closest('[data-timeline]'));
  render();save();q('[data-evidence]').open=false;
  const focus=state.screen==='overview'?q('[data-primary] button') || q('[data-boundary] button'):b.hasAttribute('data-view')?q('[data-view]'):q('[data-home]');const selected=fromTimeline?[...q('[data-timeline]').querySelectorAll('button')].find(x=>x.dataset.kind===state.selection.kind&&x.dataset.id===state.selection.id):null;(selected || focus)?.focus({preventScroll:true});
 });
 q('[data-discuss]').addEventListener('click',async()=>{
  const selected={...state.selection},name=label(selected),b=q('[data-discuss]');b.disabled=true;
  const prompt='继续讨论已交付的工程图谱。报告 '+data.report_hash+'，对象 '+selected.kind+':'+selected.id+'（'+name+'）。请恢复原报告，解释此处的依据、关系、例外和关联建议；不要重跑普查，也不要将本次讨论视为写入授权。';
  try{if(!window.openai?.sendFollowUpMessage)throw Error('unavailable');await window.openai.sendFollowUpMessage({prompt,title:'继续讨论“'+name+'”'});q('[data-status]').textContent='续问请求已提交；以聊天中的实际消息为准。';}
  catch{q('[data-status]').textContent='此端无法发起续问。可在当前聊天继续讨论报告 '+data.report_hash+' 中的 '+selected.kind+':'+selected.id+'（'+name+'）。';}finally{b.disabled=false;}
 });
 renderOverview();restore(window.openai?.widgetState);render();
 window.addEventListener('openai:set_globals',event=>{if(restore(event.detail?.globals?.widgetState))render();});
})();
</script>
